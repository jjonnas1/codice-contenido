<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Códice: Derecho Colombiano · Descarga gratis</title>
<meta name="description" content="Trivia de derecho colombiano: cada pregunta cita el artículo y la norma oficial. Gratis en iPhone y Android.">
<meta property="og:title" content="El Códice: Derecho Colombiano">
<meta property="og:description" content="Trivia de derecho colombiano: cada pregunta cita el artículo y la norma oficial. Gratis en iPhone y Android.">
<meta property="og:image" content="https://jjonnas1.github.io/codice-contenido/app/icono.png">
<meta property="og:url" content="https://jjonnas1.github.io/codice-contenido/app/">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --navy:#0f1d36; --navy2:#1c3157; --cream:#f5f0e6; --muted:#b9c2d3; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:linear-gradient(160deg,var(--navy2),var(--navy)); color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; text-align:center; }
  main { max-width:420px; width:100%; }
  img.icono { width:112px; height:112px; border-radius:26px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  h1 { font-size:26px; line-height:1.2; margin:20px 0 8px; }
  p { color:var(--muted); font-size:16px; line-height:1.5; margin:0 0 28px; }
  a.tienda { display:block; padding:16px; margin:0 0 12px; border-radius:14px; font-size:17px; font-weight:600;
    text-decoration:none; background:var(--cream); color:var(--navy); }
  a.tienda.sec { background:transparent; color:var(--cream); border:1.5px solid rgba(245,240,230,.5); }
  #aviso { font-size:14px; color:var(--muted); min-height:20px; margin-bottom:16px; }
  footer { margin-top:28px; font-size:13px; color:var(--muted); }
  footer a { color:var(--cream); }
</style>
</head>
<body>
<main>
  <img class="icono" src="icono.png" alt="Ícono de El Códice">
  <h1>El Códice: Derecho Colombiano</h1>
  <p>Trivia de derecho colombiano para estudiantes, abogados y concursos públicos. Cada pregunta cita el artículo y la norma oficial.</p>
  <div id="aviso"></div>
  <a class="tienda" id="ios" href="https://apps.apple.com/co/app/id6821622863">Descargar en el App Store (iPhone)</a>
  <a class="tienda" id="android" href="https://play.google.com/store/apps/details?id=com.castellanosabogados.elcodice">Descargar en Google Play (Android)</a>
  <footer>Gratis · Un proyecto de <a href="https://jonatancastellanosabogado.com/">Castellanos Abogados</a></footer>
</main>
<script>
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    var bot = /facebookexternalhit|Facebot|bot|crawler|spider|preview/i.test(ua);
    var a = document.getElementById('ios'), b = document.getElementById('android');
    if (ios) { b.className += ' sec'; a.parentNode.insertBefore(a, b); }
    else if (android) { a.className += ' sec'; b.parentNode.insertBefore(b, a); }
    else { b.className += ' sec'; return; }
    if (bot) return;
    document.getElementById('aviso').textContent = 'Abriendo la tienda…';
    setTimeout(function () { location.href = ios ? a.href : b.href; }, 400);
  })();
</script>
</body>
</html>
